services:
  - type: web
    name: verigate-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://veri-gate-kn5d.vercel.app
      - key: FRONTEND_URL
        value: https://veri-gate-kn5d.vercel.app
